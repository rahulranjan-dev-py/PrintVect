name: An idea
description: Something PrintVect could do better or should do too.
labels: [enhancement]
body:
  - type: textarea
    id: need
    attributes:
      label: What would help your office
      description: The situation and what gets in the way today. A real example helps most.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How PrintVect could help
      description: Optional. Your idea of how it could work.
