name: release

# Publishes a GitHub Release carrying the setup program. Every installed PrintVect looks at the latest
# release once a day (Settings tab, Updates) and offers it with one click, so this is how an update
# reaches every PC. Since 0.5.8 a new version is published as a TEST version (a pre-release) first:
# GitHub's "latest release" is never a pre-release, so PCs do not install it by themselves. Once it has
# been tried, Actions > promote > Run workflow hands it to every PC. Ways to start this one (docs/releasing.md):
#   1. Actions > release > Run workflow (the tag is created from Directory.Build.props; "stage" picks a test
#      version, the default, or straight to every PC);
#   2. push a tag that matches <Version> in Directory.Build.props:   git tag v0.2.0 && git push origin v0.2.0
#      (a test version);
#   3. on the GitHub website: Releases > Draft a new release, new tag v<Version>, target = the branch, tick
#      "Set as a pre-release" for a test version, Publish; the setup program and its checksum are added later.
# The release text is "what changed" from CHANGELOG.md (tools/release_notes.py), so write that section first.
# A version whose release already carries a setup program is left alone (warning in the run), so
# raise <Version> (all three lines in Directory.Build.props) before publishing the next one.

on:
  push:
    tags: ['v*']
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      stage:
        description: 'test = a pre-release only the PCs you install it on get (promote it later); everyone = every PC at once'
        type: choice
        options: [test, everyone]
        default: test

# A release made on the website fires both "push tag" and "release published": run them one after the other.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  DOTNET_NOLOGO: 1
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  TESTINGPLATFORM_TELEMETRY_OPTOUT: 1

jobs:
  release:
    name: Build, test and publish the release (Windows)
    runs-on: windows-latest

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Work out the version
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Select-String -Path Directory.Build.props -Pattern '<Version>([^<]+)</Version>').Matches[0].Groups[1].Value
          $tag = "v$version"
          if ($env:GITHUB_REF -like 'refs/tags/*') {
            $pushed = $env:GITHUB_REF -replace '^refs/tags/', ''
            if ($pushed -ne $tag) {
              throw "The tag $pushed does not match <Version>$version</Version> in Directory.Build.props. Fix one of them, then tag again."
            }
          }
          $assets = gh release view $tag --json assets --jq '.assets[].name' 2>$null
          if ($LASTEXITCODE -eq 0) {
            if ("$assets" -match 'PrintVect-Setup-') {
              Write-Host "::warning::Nothing to publish: release $tag already carries its setup program. To release a new version, raise <Version> in Directory.Build.props first."
              "SKIP=1" >> $env:GITHUB_ENV
            } else {
              Write-Host "Release $tag exists without a setup program (made on the GitHub website); the files will be added to it."
              "EXISTING=1" >> $env:GITHUB_ENV
            }
          }
          "VERSION=$version" >> $env:GITHUB_ENV
          "TAG=$tag" >> $env:GITHUB_ENV
          Write-Host "PrintVect $version, release $tag"
          # "gh release view" exits with 1 when the release does not exist yet (the normal case for a pushed tag or
          # Run workflow). The runner ends a pwsh step with the last exit code, so clear it or the step fails here.
          $global:LASTEXITCODE = 0

      - name: Add MSBuild to PATH
        if: env.SKIP != '1'
        uses: microsoft/setup-msbuild@v2

      - name: Restore NuGet packages
        if: env.SKIP != '1'
        run: msbuild PrintVect.sln /t:Restore /p:Configuration=Release /v:minimal /nologo

      - name: Build (Release, AnyCPU)
        if: env.SKIP != '1'
        run: msbuild PrintVect.sln /p:Configuration=Release /v:minimal /nologo

      - name: Unit tests
        if: env.SKIP != '1'
        run: tests\PrintVect.Tests\bin\Release\net48\PrintVect.Tests.exe

      - name: Collect the program files
        if: env.SKIP != '1'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts\PrintVect | Out-Null
          Copy-Item -Path src\PrintVect.App\bin\Release\net48\*     -Destination artifacts\PrintVect -Recurse -Force
          Copy-Item -Path src\PrintVect.Elevate\bin\Release\net48\* -Destination artifacts\PrintVect -Recurse -Force
          Copy-Item -Path src\PrintVect.Send\bin\Release\net48\*    -Destination artifacts\PrintVect -Recurse -Force
          Copy-Item -Path docs\samples\*.xps                          -Destination artifacts\PrintVect
          Copy-Item -Path README.md, LICENSE -Destination artifacts\PrintVect
          Get-ChildItem artifacts\PrintVect | Format-Table Name, Length

      - name: Build the installer (Inno Setup 6)
        if: env.SKIP != '1'
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress | Out-Null
          }
          & $iscc "/DAppVersion=$env:VERSION" "/DSourceDir=$PWD\artifacts\PrintVect" installer\PrintVect.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with exit code $LASTEXITCODE" }
          Get-ChildItem artifacts\installer | Format-Table Name, Length

      - name: Write the checksum file
        if: env.SKIP != '1'
        shell: pwsh
        run: |
          $exe = Get-Item "artifacts\installer\PrintVect-Setup-$env:VERSION.exe"
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          [System.IO.File]::WriteAllText("$($exe.FullName).sha256", "$hash  $($exe.Name)`n")
          Get-Content "$($exe.FullName).sha256"

      - name: Publish the GitHub release
        if: env.SKIP != '1'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          # Run workflow picks the stage; a pushed tag makes a test version.
          STAGE: ${{ github.event.inputs.stage || 'test' }}
        run: |
          $exe = "artifacts\installer\PrintVect-Setup-$env:VERSION.exe"
          if ($env:EXISTING -eq '1') {
            # The release was made on the website: add the files to it, and its text when none was typed.
            gh release upload $env:TAG $exe "$exe.sha256" --clobber
            if ($LASTEXITCODE -ne 0) { throw "gh release upload failed with exit code $LASTEXITCODE" }
            $existing = gh release view $env:TAG --json body,isPrerelease | ConvertFrom-Json
            if ([string]::IsNullOrWhiteSpace($existing.body)) {
              $noteArgs = @($env:VERSION, '--out', 'release-notes.md')
              if ($existing.isPrerelease) { $noteArgs += '--test' }
              python tools/release_notes.py @noteArgs
              if ($LASTEXITCODE -ne 0) { throw "tools/release_notes.py failed with exit code $LASTEXITCODE" }
              gh release edit $env:TAG --notes-file release-notes.md
              if ($LASTEXITCODE -ne 0) { throw "gh release edit failed with exit code $LASTEXITCODE" }
            }
          } else {
            $test = $env:STAGE -ne 'everyone'
            $noteArgs = @($env:VERSION, '--out', 'release-notes.md')
            if ($test) { $noteArgs += '--test' }
            python tools/release_notes.py @noteArgs
            if ($LASTEXITCODE -ne 0) { throw "tools/release_notes.py failed with exit code $LASTEXITCODE" }
            # Draft first, then publish: the release never shows up without its files.
            gh release create $env:TAG --target $env:GITHUB_SHA --title "PrintVect $env:VERSION" --notes-file release-notes.md --draft $exe "$exe.sha256"
            if ($LASTEXITCODE -ne 0) { throw "gh release create failed with exit code $LASTEXITCODE" }
            if ($test) {
              # A pre-release is never GitHub's "latest release", which is what installed PCs ask for.
              gh release edit $env:TAG --draft=false --prerelease
            } else {
              gh release edit $env:TAG --draft=false --latest
            }
            if ($LASTEXITCODE -ne 0) { throw "gh release edit failed with exit code $LASTEXITCODE" }
            if ($test) {
              Write-Host "::notice::Published TEST version $env:TAG (pre-release): installed PCs do not take it by themselves. Once it works: Actions, promote, Run workflow."
            }
          }
          Write-Host "Published https://github.com/$env:GITHUB_REPOSITORY/releases/tag/$env:TAG"
